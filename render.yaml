# Render Blueprint (infrastructure as code) for the replay laboratory. The service was created from the CLI; this file
# documents the intended configuration: the web app and the grader Private Service that the live mode calls.
services:
  - type: web
    name: social-llm-mas-lab
    runtime: docker
    repo: https://github.com/MarcoBecattini/social-llm-mas-lab
    branch: main
    region: frankfurt
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /_stcore/health
    autoDeploy: true
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: SOCIALMAS_DATA_DIR
        value: /var/data
      - key: SOCIALMAS_ADMIN_USER          # bootstrap credential, valid only while no account exists
        sync: false
      - key: SOCIALMAS_ADMIN_PASSWORD
        sync: false
      - key: SOCIALMAS_SESSION_SECRET      # optional: if absent, generated once and kept in the database on the disk
        generateValue: true
      - key: GRADER_URL                    # internal address of the grader Private Service (same workspace, private network)
        value: http://social-llm-mas-grader:10000
  - type: pserv
    name: social-llm-mas-grader
    runtime: docker
    repo: https://github.com/MarcoBecattini/social-llm-mas-lab
    branch: main
    region: frankfurt
    plan: starter
    rootDir: grader
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    envVars:
      - key: GRADER_WORKERS
        value: "2"
